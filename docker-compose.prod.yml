#
# `docker-compose` file for production-ish self-hosted deployments.
# Forked from docker-compose.hobby.yml with two changes:
#   1) Path fixes for running from the repo root (no parent ./posthog/ wrapper).
#   2) Local builds for Python (Dockerfile) and Node (Dockerfile.node) images.
#
# Compose with:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Do NOT pass docker-compose.base.yml in -f / COMPOSE_FILE — `extends:` already
# pulls from it. Listing both also drags in dev-only services (kafka_ui, flower,
# opensearch, localstack, maildev, otel-collector, jaeger, duckgres, capture-ai,
# capture-logs).
#

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '50m'
        max-file: '3'

# Override base.yml's `restart: on-failure` for long-running services.
# `on-failure` does NOT restart on clean exit (code 0), so any service that
# self-terminates (panic-handled, OOM-killed cleanly, etc.) stays down until
# the next compose up. Use `unless-stopped` to keep them alive across reboots
# while still respecting an explicit `docker compose stop`.
x-restart-prod: &restart-prod
    restart: unless-stopped

# Per-service memory caps. Sized for a 30 GB / 8-core single-host install.
# Without these, a single runaway container (most often `clickhouse`, `web`,
# or one of the Node ingestion services) takes the whole box. ClickHouse has
# its own internal cap in docker/clickhouse/config.d.prod/memory_limits.xml
# (8 GB max_server_memory_usage); this docker-level cap (10 GB) gives the
# CH cgroup ~2 GB headroom for kernel page cache + buffers.
#
# `mem_limit` is enforced by plain `docker compose up`. The newer
# `deploy.resources.limits` block is Swarm-only and silently ignored.
#
# Overcommit: the SUM of all caps below (~36 GB with ingestion-general at
# 2 replicas) intentionally exceeds the 30 GB host. Caps are upper bounds,
# not reservations — services don't all peak simultaneously. Realistic
# steady-state usage is ~24-28 GB; the caps are spike absorbers. The 4 GB
# swap (see bin/setup-swap) backstops the worst case where multiple
# services peak at once. If you scale ingestion-general to 4 replicas
# (or boot more services), trim other anchors or upgrade RAM.
#
# Tuning: after deploy, watch `docker stats` for 24-48 h. Bump any service
# consistently above 80% of its cap; lower any service consistently below
# 20%. ClickHouse cap is also a hard ceiling — bump only after also bumping
# max_server_memory_usage in config.d.prod/memory_limits.xml.
x-mem-clickhouse: &mem-clickhouse  { mem_limit: 10g,    memswap_limit: 10g }
# Postgres needs real headroom: shared_buffers (1g) + work_mem × max_connections
# (16m × 200 = 3.2g worst case during sorts/hashes) + maintenance_work_mem ×
# autovacuum_workers (256m × 3 = 768m) + WAL/per-backend overhead (~500m) =
# ~5.5 GB worst case. 4 GB cgroup with 5 GB swap headroom keeps PG alive when
# every Celery + Django + Node service hammers it at once. Lowering this also
# requires lowering POSTGRES_MAX_CONNECTIONS or POSTGRES_WORK_MEM in .env.
x-mem-postgres:   &mem-postgres    { mem_limit: 4g,     memswap_limit: 5g }
# Redpanda (kafka service) is told `--memory 3G --reserve-memory 500M` in
# base.yml. seastar startup checks the cgroup limit and subtracts ~550 MiB for
# its own overhead before comparing against `--memory`, so a 3500m cgroup
# yields "available 2.87 GiB", short of the 3 GiB request and the container
# crash-loops with `Could not initialize seastar: insufficient physical memory`.
# 4g leaves ~1 GiB head-room above the 3G ask; bumping further only matters if
# you also raise `--memory` in the command override.
x-mem-kafka:      &mem-kafka       { mem_limit: 4g,     memswap_limit: 4g }
x-mem-redis:      &mem-redis       { mem_limit: 1200m,  memswap_limit: 1200m }
x-mem-django-web: &mem-django-web  { mem_limit: 2500m,  memswap_limit: 2500m }
x-mem-django:     &mem-django      { mem_limit: 3g,     memswap_limit: 3g    }
x-mem-django-sm:  &mem-django-sm   { mem_limit: 1500m,  memswap_limit: 1500m }
x-mem-node:       &mem-node        { mem_limit: 1g,     memswap_limit: 1g }
x-mem-node-hot:   &mem-node-hot    { mem_limit: 1500m,  memswap_limit: 1500m }
x-mem-node-sm:    &mem-node-sm     { mem_limit: 384m,   memswap_limit: 512m }
x-mem-temporal:   &mem-temporal    { mem_limit: 768m,   memswap_limit: 1g }
x-mem-storage:    &mem-storage     { mem_limit: 384m,   memswap_limit: 512m }
x-mem-rust:       &mem-rust        { mem_limit: 256m,   memswap_limit: 384m }
x-mem-rust-hot:   &mem-rust-hot    { mem_limit: 384m,   memswap_limit: 512m }
x-mem-tiny:       &mem-tiny        { mem_limit: 256m,   memswap_limit: 256m }
x-mem-xtiny:      &mem-xtiny       { mem_limit: 128m,   memswap_limit: 128m }

# Postgres connection env block. Swaps the `posthog`/`posthog` default that
# dev-services.env + base.yml hardcode. Merged into every service that talks
# to Postgres via `<<: *pg-env`. Unused vars (e.g. PERSONS_URL on a service
# that doesn't read it) are harmless — Django/Node/Rust services only read
# what they need.
#
# Note: env_file from base.yml takes LOWER priority than environment: keys
# in the same service, so spreading these here cleanly overrides the hardcoded
# `postgres://posthog:posthog@db:5432/posthog` values from dev-services.env.
x-pg-env: &pg-env
    DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog'
    PERSONS_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog'
    BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog'
    CYCLOTRON_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog'
    WRITE_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog'
    READ_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog'
    PERSONS_WRITE_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog'
    PERSONS_READ_DATABASE_URL: 'postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog'
    PERSONS_URL: 'postgres://posthog:${POSTHOG_DB_PASSWORD}@db:5432/posthog'
    PGPASSWORD: ${POSTHOG_DB_PASSWORD}
    PGUSER: posthog
    PGHOST: db

services:
    db:
        <<: *mem-postgres
        extends:
            file: docker-compose.base.yml
            service: db
        image: ${DOCKER_REGISTRY_PREFIX:-}postgres:15.12-alpine
        logging: *default-logging
        # Overrides the `posthog` default password from base.yml. POSTGRES_USER
        # and POSTGRES_DB stay as `posthog` — only the password is parameterized.
        environment:
            POSTGRES_PASSWORD: ${POSTHOG_DB_PASSWORD}
        # Postgres tuning for a single-host install. Defaults (shared_buffers=128MB)
        # are sized for embedded use, not a real workload. With 4 GB cgroup cap:
        #   shared_buffers       = 25% of cgroup RAM (PG's own cache)
        #   effective_cache_size = realistic OS page cache size (planner hint, not allocated)
        #   work_mem             = per-sort/hash-join scratch (multiple per query)
        #   max_connections      = generous; PostHog opens ~150 across all services
        #
        # Write-throughput knobs (matter for high-volume person-resolution UPSERTs):
        #   synchronous_commit=off  - 3-5x write throughput on bursty workloads.
        #                             Trade-off: lose last few seconds of unflushed
        #                             transactions on a kernel/power crash. Acceptable
        #                             for analytics — events can be re-derived from
        #                             Kafka replay (6h retention). NOT acceptable for
        #                             billing/financial data.
        #   max_wal_size=4GB        - default 1GB triggers checkpoints every few
        #                             minutes under load → I/O storms. 4GB stretches
        #                             checkpoints to 15-30min intervals.
        #   checkpoint_timeout=15min - paired with max_wal_size; smoother I/O.
        #   checkpoint_completion_target=0.9 - spread checkpoint writes across 90%
        #                             of the interval instead of bursting.
        #   autovacuum_vacuum_scale_factor=0.05 - default 0.2 means vacuum kicks in
        #                             only when 20% of a table is dead tuples. With
        #                             posthog_person + posthog_persondistinctid
        #                             being UPDATE-heavy, 5% keeps them lean.
        #   autovacuum_naptime=20s  - default 60s; check more often on hot tables.
        #
        # Tune via .env (POSTGRES_*) without rebuilding.
        command: >
            postgres
            -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
            -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
            -c work_mem=${POSTGRES_WORK_MEM:-16MB}
            -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
            -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
            -c synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-off}
            -c max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}
            -c checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-15min}
            -c checkpoint_completion_target=0.9
            -c autovacuum_vacuum_scale_factor=${POSTGRES_AUTOVACUUM_SCALE_FACTOR:-0.05}
            -c autovacuum_naptime=${POSTGRES_AUTOVACUUM_NAPTIME:-20s}
        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis7:
        <<: *mem-redis
        extends:
            file: docker-compose.base.yml
            service: redis7
        # Override base.yml's `--maxmemory 200mb --maxmemory-policy allkeys-lru`.
        # Reasons:
        #   1. 200 MB is too small. This Redis is shared by Celery (broker +
        #      result backend), team token cache, hypercache RemoteConfig
        #      blobs, feature flags, CDP state, cookieless tracking, replay
        #      API state, and various app caches. Cloud separates these into
        #      multiple Redis instances; we don't.
        #   2. `allkeys-lru` evicts ANY key under pressure, including in-flight
        #      Celery messages. `volatile-lru` only evicts keys with a TTL, so
        #      app cache entries get evicted first and Celery queues survive.
        #   3. Persistence (RDB + AOF) is wasted IO for a pure cache + ephemeral
        #      queue. Celery beat re-emits unfinished periodic tasks on restart;
        #      caches re-warm fast. Flip `--appendonly yes` if you ever need
        #      durability across power-cuts.
        # Bump --maxmemory to 2gb if `INFO stats` shows evicted_keys climbing.
        command: redis-server --maxmemory-policy volatile-lru --maxmemory 1gb --save "" --appendonly no
        logging: *default-logging
        volumes:
            - redis7-data:/data

    clickhouse:
        #
        # Note: please keep the default version in sync across
        #       `posthog` and the `charts-clickhouse` repos
        #
        <<: *mem-clickhouse
        extends:
            file: docker-compose.base.yml
            service: clickhouse
        # Pin via .env (CLICKHOUSE_SERVER_IMAGE) for reproducible deploys.
        # base.yml falls back to 26.3.9.8 if unset.
        image: ${CLICKHOUSE_SERVER_IMAGE:-clickhouse/clickhouse-server:26.3.9.8}
        restart: on-failure
        logging: *default-logging
        # CLICKHOUSE_PASSWORD is read by the server itself (consumed by users.d.prod
        # overlay via `from_env` for the `default` user's <password> tag). The
        # `default` user becomes password-protected after first start.
        environment:
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
        depends_on:
            - kafka
            - zookeeper
        volumes:
            - ./posthog/idl:/idl
            - ./docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
            - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
            - ./docker/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml
            # Prod-only overlay: system_log table TTLs. Without this, query_log /
            # trace_log / metric_log / part_log grow unbounded — tens of GB on
            # busy installs in a few weeks.
            - ./docker/clickhouse/config.d.prod/system_log_ttl.xml:/etc/clickhouse-server/config.d/system_log_ttl.xml
            # Prod-only overlay: server memory + concurrency caps. Without this,
            # max_server_memory_usage_to_ram_ratio=0.9 from config.xml lets CH
            # grab 90% of host RAM, OOM-killing everything else under load.
            - ./docker/clickhouse/config.d.prod/memory_limits.xml:/etc/clickhouse-server/config.d/memory_limits.xml
            - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
            # Prod-only overlay: sets a password on the `default` user via from_env.
            # Without this, anyone with shell access to the host can `docker exec
            # clickhouse clickhouse-client` and dump everything.
            - ./docker/clickhouse/users.d.prod/default-password.xml:/etc/clickhouse-server/users.d/default-password.xml
            # Prod-only overlay: caps per-query memory at 3 GB so concurrent
            # queries fit under max_server_memory_usage (8 GB). Without this,
            # users.xml ships max_memory_usage=10 GB which exceeds the server
            # cap — the second concurrent heavy query fails with a confusing
            # "Memory limit (total) exceeded" error.
            - ./docker/clickhouse/users.d.prod/memory_per_query.xml:/etc/clickhouse-server/users.d/memory_per_query.xml
            - ./docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml
            - ./posthog/user_scripts:/var/lib/clickhouse/user_scripts
            - clickhouse-data:/var/lib/clickhouse

    zookeeper:
        # Override *mem-storage (384m) — ZK is a JVM workload and the default
        # heap + JVM overhead pushes RSS to 98% of 384m on idle, OOM-loops
        # under any DDL burst. CH ReplicatedMergeTree depends on this; if ZK
        # dies, all CH writes block.
        mem_limit: 768m
        memswap_limit: 768m
        extends:
            file: docker-compose.base.yml
            service: zookeeper
        logging: *default-logging
        # Without these, transaction logs grow unbounded — base.yml has no
        # autopurge. ZK datalog can reach hundreds of GB on busy installs in
        # a few weeks.
        environment:
            ZOO_AUTOPURGE_PURGEINTERVAL: 24
            ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
            # Cap the JVM heap so it doesn't unilaterally try to grab the
            # whole mem_limit. 256m heap leaves ~500m for non-heap (metaspace,
            # threads, direct buffers, container overhead).
            JVMFLAGS: '-Xms128m -Xmx256m'
        volumes:
            - zookeeper-datalog:/datalog
            - zookeeper-data:/data
            - zookeeper-logs:/logs
    kafka:
        <<: *mem-kafka
        extends:
            file: docker-compose.base.yml
            service: kafka
        logging: *default-logging
        depends_on:
            - zookeeper
        # Retention defaults: 6 h ms / 6 h hours / 5 min check.
        # Kafka here is a buffer between Rust capture and the consumers
        # (plugin-server, ClickHouse Kafka engine). Healthy consumers drain
        # messages within seconds; retention only matters as a recovery window
        # if a consumer dies. 6 h covers overnight outages on a single-host
        # box with auto-restart. Lower (1 h) saves disk; higher (24 h) gives
        # more recovery slack at the cost of disk.
        environment:
            KAFKA_LOG_RETENTION_MS: ${KAFKA_LOG_RETENTION_MS:-21600000}
            KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
            KAFKA_LOG_RETENTION_HOURS: 6
        volumes:
            - kafka-data:/bitnami/kafka

    worker:
        <<: [*restart-prod, *mem-django]
        image: posthog-app
        build: .
        extends:
            file: docker-compose.base.yml
            service: worker
        logging: *default-logging
        environment:
            <<: *pg-env
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            CLICKHOUSE_PASSWORD: $CLICKHOUSE_PASSWORD
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: $OBJECT_STORAGE_PASSWORD
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://$DOMAIN
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENABLED: true
            RECORDING_API_URL: http://recording-api:6738
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            POSTHOG_SKIP_MIGRATION_CHECKS: '1'
            # Celery prefork concurrency. Defaults to nproc (8 on this host) which OOMs
            # the container — each prefork process holds a full Django+dagster heap (~400MB).
            # 2 is plenty for self-hosted single-tenant; raise if task throughput needs it.
            WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
            # Recycle each prefork worker after N tasks to release accumulated heap
            # (Django ORM caches, infi.clickhouse_orm metadata, leaks in dagster/etc).
            # Without this, RSS grows to mem_limit and OOMs after ~hours of uptime.
            CELERY_MAX_TASKS_PER_CHILD: ${CELERY_MAX_TASKS_PER_CHILD:-200}
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_started
            kafka:
                condition: service_healthy
            web:
                condition: service_started
    web:
        <<: [*restart-prod, *mem-django-web]
        image: posthog-app
        build: .
        extends:
            file: docker-compose.base.yml
            service: web
        command: /compose/start
        logging: *default-logging
        volumes:
            - ./compose:/compose
        environment:
            <<: *pg-env
            SITE_URL: https://$DOMAIN
            LIVESTREAM_HOST: 'https://${DOMAIN}/livestream'
            SECRET_KEY: $POSTHOG_SECRET
            CLICKHOUSE_PASSWORD: $CLICKHOUSE_PASSWORD
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: $OBJECT_STORAGE_PASSWORD
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://$DOMAIN
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            OBJECT_STORAGE_ENABLED: true
            RECORDING_API_URL: http://recording-api:6738
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            OTEL_SERVICE_NAME: 'posthog'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
            OTEL_SDK_DISABLED: 'true'
            OPT_OUT_CAPTURE: ${OPT_OUT_CAPTURE:-false}
            DEPLOYMENT: 'vibes-foss'
            # Bypass the upstream nginx-unit docker-entrypoint.sh, which checks
            # `[ ! -z "$(ls -A /var/lib/unit/)" ]` and skips loading config when
            # /var/lib/unit has any contents. Unit creates `certs/` and `scripts/`
            # subdirs eagerly on startup, so that check ALWAYS trips → empty
            # config → no listener on :8000 → Caddy gets connection refused.
            # Pre-baking config into a temp statedir avoids the broken check
            # entirely. Bonus: skips a Unit double-start, halving boot time.
            NGINX_UNIT_PRELOAD_CONFIG: 'true'
            # Cap prefork app workers. Default is 4; each loads full Django +
            # dagster (~400MB resident). 4 × 400MB ≈ 1.6GB which OOMs the 2.5GB
            # limit (need headroom for unit master + controller + router + JIT
            # caches). 2 workers handle ample QPS for self-hosted single-tenant.
            NGINX_UNIT_APP_PROCESSES: ${NGINX_UNIT_APP_PROCESSES:-2}
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs

    plugins:
        <<: [*restart-prod, *mem-node]
        image: posthog-node
        build:
            context: .
            dockerfile: Dockerfile.node
        extends:
            file: docker-compose.base.yml
            service: plugins
        logging: *default-logging
        environment:
            <<: *pg-env
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            CLICKHOUSE_PASSWORD: $CLICKHOUSE_PASSWORD
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: $OBJECT_STORAGE_PASSWORD
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://$DOMAIN
            OBJECT_STORAGE_ENABLED: true
            CDP_REDIS_HOST: redis7
            CDP_REDIS_PORT: 6379
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
        volumes:
            - ./share:/share
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs

    ingestion-general:
        <<: [*restart-prod, *mem-node-hot]
        image: posthog-node
        build:
            context: .
            dockerfile: Dockerfile.node
        extends:
            file: docker-compose.base.yml
            service: ingestion-general
        logging: *default-logging
        # Two replicas. The Rust capture service partitions Kafka messages by
        # `{token}:{distinct_id}` (rust/common/types/src/event.rs:304), so events
        # for the same user always land on the same partition — two consumers
        # in the same group safely parallelize without breaking person ordering.
        # The accompanying partition bump on `events_plugin_ingestion` (3 parts,
        # see kafka-init below) is required for both replicas to actually do
        # work — otherwise the second consumer sits idle.
        # Each replica gets its own mem_limit (1.5 GB), so this adds 1.5 GB to
        # the total cgroup budget. Lower POSTGRES_MAX_CONNECTIONS to ~150 if
        # you see "too many connections" — each replica opens its own pool.
        deploy:
            replicas: 2
        environment:
            <<: *pg-env
            CLICKHOUSE_PASSWORD: $CLICKHOUSE_PASSWORD
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
        # Map-style depends_on so we can pin kafka-init to
        # `service_completed_successfully`. Without this the second consumer
        # could join the consumer group before partitions exist, briefly
        # leaving the second replica idle (Kafka rebalances after kafka-init
        # grows partitions, but it's an avoidable startup transient).
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_started
            kafka:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully

    ingestion-sessionreplay:
        <<: [*restart-prod, *mem-node]
        image: posthog-node
        build:
            context: .
            dockerfile: Dockerfile.node
        extends:
            file: docker-compose.base.yml
            service: ingestion-sessionreplay
        logging: *default-logging
        environment:
            <<: *pg-env
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            SESSION_RECORDING_V2_S3_TIMEOUT_MS: 120000
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
        depends_on:
            - db
            - redis7
            - kafka
            - seaweedfs

    recording-api:
        <<: [*restart-prod, *mem-node-sm]
        image: posthog-node
        build:
            context: .
            dockerfile: Dockerfile.node
        extends:
            file: docker-compose.base.yml
            service: recording-api
        logging: *default-logging
        environment:
            <<: *pg-env
            CLICKHOUSE_PASSWORD: $CLICKHOUSE_PASSWORD
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
        depends_on:
            - db
            - redis7
            - clickhouse

    ingestion-error-tracking:
        <<: [*restart-prod, *mem-node-sm]
        image: posthog-node
        build:
            context: .
            dockerfile: Dockerfile.node
        extends:
            file: docker-compose.base.yml
            service: ingestion-error-tracking
        logging: *default-logging
        environment:
            <<: *pg-env
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-logs:
        <<: [*restart-prod, *mem-node-sm]
        image: posthog-node
        build:
            context: .
            dockerfile: Dockerfile.node
        extends:
            file: docker-compose.base.yml
            service: ingestion-logs
        logging: *default-logging
        environment:
            <<: *pg-env
            # nodejs/src/logs-ingestion/config.ts line 64:
            #   LOGS_REDIS_TLS: isProdEnv() ? true : false
            # `isProdEnv()` returns true here, which makes the consumer's
            # secondary Redis client attempt a TLS handshake against
            # plaintext redis7:6379 — server never responds → ETIMEDOUT
            # → restart loop. Force plaintext.
            LOGS_REDIS_TLS: 'false'
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-traces:
        <<: [*restart-prod, *mem-node-sm]
        image: posthog-node
        build:
            context: .
            dockerfile: Dockerfile.node
        extends:
            file: docker-compose.base.yml
            service: ingestion-traces
        logging: *default-logging
        environment:
            <<: *pg-env
            # Same reason as ingestion-logs above (config.ts line 115).
            TRACES_REDIS_TLS: 'false'
        depends_on:
            - db
            - redis7
            - kafka

    proxy:
        <<: *mem-tiny
        extends:
            file: docker-compose.base.yml
            service: proxy
        logging: *default-logging
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        environment:
            CADDY_TLS_BLOCK: $TLS_BLOCK
            CADDY_HOST: '$DOMAIN, http://, https://'
        depends_on:
            - web
            - livestream
    objectstorage:
        <<: *mem-storage
        extends:
            file: docker-compose.base.yml
            service: objectstorage

        restart: on-failure
        logging: *default-logging
        # Override the well-known `object_storage_root_password` default from
        # base.yml. MINIO_ROOT_USER stays as `object_storage_root_user` — only
        # the password is parameterized.
        environment:
            MINIO_ROOT_PASSWORD: $OBJECT_STORAGE_PASSWORD
        volumes:
            - objectstorage:/data
        # Bind MinIO API + console to loopback only. Public access flows through
        # Caddy at /posthog/* — direct exposure of these ports leaks list-bucket
        # to anyone with the IP. Default base.yml credentials are well-known.
        ports:
            - '127.0.0.1:19000:19000'
            - '127.0.0.1:19001:19001'

    seaweedfs:
        <<: *mem-storage
        extends:
            file: docker-compose.base.yml
            service: seaweedfs
        container_name: '${SEAWEEDFS_DOCKER_NAME:-seaweedfs-main}'
        restart: on-failure
        logging: *default-logging
        ports:
            - '127.0.0.1:8333:8333' # S3 API
            - '127.0.0.1:9333:9333' # Master server
        volumes:
            - seaweedfs:/data
        healthcheck:
            test:
                [
                    'CMD',
                    'sh',
                    '-c',
                    "echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog",
                ]
            interval: 5s
            timeout: 10s
            retries: 30
            start_period: 10s

    asyncmigrationscheck:
        <<: *mem-django-web
        image: posthog-app
        build: .
        extends:
            file: docker-compose.base.yml
            service: asyncmigrationscheck
        logging: *default-logging
        environment:
            <<: *pg-env
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            CLICKHOUSE_PASSWORD: $CLICKHOUSE_PASSWORD
            # Doesn't actually touch MinIO, but inherits the default from
            # dev-services.env via env_file. Override so leaked credentials
            # don't appear in `docker compose config`.
            OBJECT_STORAGE_SECRET_ACCESS_KEY: $OBJECT_STORAGE_PASSWORD
            SKIP_ASYNC_MIGRATIONS_SETUP: 0

    # Temporal containers
    temporal:
        <<: *mem-temporal
        extends:
            file: docker-compose.base.yml
            service: temporal
        logging: *default-logging
        # Temporal connects directly to Postgres for its own state (workflow
        # history, task queues). Override POSTGRES_PWD from base.yml since base
        # uses the `posthog`/`posthog` default. base.yml uses list-style env so
        # this list override fully replaces it (compose merge semantics).
        environment:
            - ENABLE_ES=false
            - POSTGRES_PWD=${POSTHOG_DB_PASSWORD}
        # Bind gRPC API to loopback only. Temporal has NO auth in this config;
        # any client with the host IP could `tctl` workflow-history dumps,
        # cancel running workflows, or start new ones. Internal services reach
        # it via docker DNS (`temporal:7233`) — host port only needed for
        # SSH-tunneled debugging (`ssh -L 7233:127.0.0.1:7233 vps`).
        ports:
            - '127.0.0.1:7233:7233'
        volumes:
            - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    elasticsearch:
        # Bumped from *mem-storage (384m) to 1g. base.yml ships ES with
        # ES_JAVA_OPTS=-Xms256m -Xmx256m AND the JVM's default
        # -XX:MaxDirectMemorySize=128m, so JVM heap+direct alone is 384 MiB —
        # leaving 0 for metaspace, code cache, native heap, page cache. The
        # cgroup OOM-killer fires every ~10 min once Lucene merges and ingest
        # pipelines warm up. 1g gives ~600 MiB headroom above heap+direct,
        # which keeps it stable under PostHog's normal load.
        mem_limit: 1g
        memswap_limit: 1g
        extends:
            file: docker-compose.base.yml
            service: elasticsearch
        logging: *default-logging
    temporal-admin-tools:
        <<: *mem-xtiny
        extends:
            file: docker-compose.base.yml
            service: temporal-admin-tools
        logging: *default-logging
        depends_on:
            - temporal
    temporal-ui:
        <<: *mem-tiny
        extends:
            file: docker-compose.base.yml
            service: temporal-ui
        logging: *default-logging
        # Loopback only — same reasoning as temporal:7233. The UI displays
        # full workflow inputs/outputs (which contain application data) and
        # has no auth. Tunnel via `ssh -L 8081:127.0.0.1:8081 vps` to debug.
        ports:
            - '127.0.0.1:8081:8080'
        depends_on:
            temporal:
                condition: service_started
            db:
                condition: service_healthy
    temporal-django-worker:
        <<: [*restart-prod, *mem-django-sm]
        image: posthog-app
        build: .
        command: /compose/temporal-django-worker
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        logging: *default-logging
        volumes:
            - ./compose:/compose
        environment:
            <<: *pg-env
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            CLICKHOUSE_PASSWORD: $CLICKHOUSE_PASSWORD
            OBJECT_STORAGE_SECRET_ACCESS_KEY: $OBJECT_STORAGE_PASSWORD
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal

    cyclotron-janitor:
        <<: [*restart-prod, *mem-rust]
        image: posthog-cyclotron-janitor
        extends:
            file: docker-compose.base.yml
            service: cyclotron-janitor
        build:
            context: ./rust
        logging: *default-logging
        environment:
            <<: *pg-env
            KAFKA_HOSTS: 'kafka:9092'
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_started

    capture:
        <<: [*restart-prod, *mem-rust-hot]
        image: posthog-capture
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: capture
        logging: *default-logging

    replay-capture:
        <<: [*restart-prod, *mem-rust-hot]
        image: posthog-replay-capture
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: replay-capture
        logging: *default-logging

    property-defs-rs:
        <<: [*restart-prod, *mem-rust]
        image: posthog-property-defs-rs
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: property-defs-rs
        logging: *default-logging
        environment:
            <<: *pg-env
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            db:
                condition: service_healthy

    livestream:
        <<: [*restart-prod, *mem-tiny]
        image: posthog-livestream
        build:
            context: ./livestream
        extends:
            file: docker-compose.base.yml
            service: livestream
        logging: *default-logging
        environment:
            - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET}
        volumes:
            - ./docker/livestream/configs-hobby.yml:/configs/configs.yml

    feature-flags:
        <<: [*restart-prod, *mem-rust-hot]
        image: posthog-feature-flags
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: feature-flags
        logging: *default-logging
        environment:
            <<: *pg-env
        depends_on:
            - db
            - redis7

    hypercache-server:
        <<: [*restart-prod, *mem-rust]
        image: posthog-hypercache-server
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: hypercache-server
        logging: *default-logging
        depends_on:
            - redis7

    kafka-init:
        <<: *mem-tiny
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        entrypoint: /bin/sh
        logging: *default-logging
        environment:
            # MUST match the kafka service default above (21600000 = 6h). The
            # `rpk cluster config set` call below applies these values cluster-
            # wide and overrides whatever the broker thinks. Keep both defaults
            # in sync, otherwise a missing .env entry silently flips topics to
            # the kafka-init default while the broker advertises something else.
            KAFKA_LOG_RETENTION_MS: ${KAFKA_LOG_RETENTION_MS:-21600000}
            KAFKA_LOG_SEGMENT_SIZE: ${KAFKA_LOG_SEGMENT_SIZE:-134217728}
        command:
            - -c
            - |
                set -x
                echo "Waiting for Kafka broker to accept connections..."
                TIMEOUT=60
                ELAPSED=0
                # Use rpk topic list as the readiness check - it's a simple operation
                # that confirms the broker is accepting Kafka protocol requests
                until rpk topic list --brokers kafka:9092 2>/dev/null; do
                    echo "Kafka broker not ready yet (elapsed: ${ELAPSED}s)..."
                    sleep 2
                    ELAPSED=$((ELAPSED + 2))
                    if [ $ELAPSED -ge $TIMEOUT ]; then
                        echo "Timeout waiting for Kafka broker after ${TIMEOUT}s"
                        echo "Final attempt to list topics:"
                        rpk topic list --brokers kafka:9092 || true
                        exit 1
                    fi
                done

                # Apply cluster-level retention BEFORE topics are created so
                # auto-created topics inherit these defaults. base.yml's
                # `--mode dev-container` silently ignores broker env vars
                # like KAFKA_LOG_RETENTION_HOURS — cluster config still works.
                echo "Setting cluster-level retention (ms=$$KAFKA_LOG_RETENTION_MS, segment=$$KAFKA_LOG_SEGMENT_SIZE)..."
                rpk cluster config set log_retention_ms "$$KAFKA_LOG_RETENTION_MS" --brokers kafka:9092 || true
                rpk cluster config set log_segment_size "$$KAFKA_LOG_SEGMENT_SIZE" --brokers kafka:9092 || true
                rpk cluster config set log_retention_check_interval_ms 60000 --brokers kafka:9092 || true

                echo "Kafka broker is accepting requests, creating topics..."
                # Create topics needed by rust services.
                # Note: $$ escapes $ for docker-compose variable substitution.
                #
                # Single-partition topics (low traffic, no parallelism needed):
                for topic in clickhouse_events_json; do
                    if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                        echo "Topic $$topic created successfully"
                    else
                        if rpk topic list --brokers kafka:9092 | grep -q "$$topic"; then
                            echo "Topic $$topic already exists, continuing"
                        else
                            echo "Failed to create topic $$topic"
                            exit 1
                        fi
                    fi
                done

                # Multi-partition topics. ingestion-general runs with replicas=2;
                # consumer parallelism is bounded by partition count. With 3
                # partitions: 2 active consumers + 1 standby (handles rebalance).
                # Rust capture partitions by `{token}:{distinct_id}` (see
                # rust/common/types/src/event.rs:304), so per-user ordering
                # holds regardless of partition count. The `_overflow` topic
                # mirrors the main one because the same consumer drains both.
                # Bump KAFKA_INGESTION_PARTITIONS in .env to 4-6 if you scale
                # ingestion-general higher.
                INGEST_PARTS=$${KAFKA_INGESTION_PARTITIONS:-3}
                for topic in events_plugin_ingestion events_plugin_ingestion_overflow; do
                    if rpk topic create "$$topic" --brokers kafka:9092 -p "$$INGEST_PARTS" -r 1 2>&1; then
                        echo "Topic $$topic created with $$INGEST_PARTS partitions"
                    else
                        if ! rpk topic list --brokers kafka:9092 | grep -q "^$$topic"; then
                            echo "Failed to create topic $$topic"
                            exit 1
                        fi
                        # Topic already exists — likely auto-created by capture
                        # before kafka-init ran. Count current partitions and grow
                        # if needed. `rpk topic describe -p` prints one row per
                        # partition with the partition number in column 1, so
                        # counting numeric-leading rows gives the exact count.
                        # `rpk topic add-partitions --num` ADDS that many (does
                        # NOT set total) so we pass the delta, not the target.
                        CURRENT=$$(rpk topic describe "$$topic" -p --brokers kafka:9092 2>/dev/null \
                            | grep -cE '^[[:space:]]*[0-9]+[[:space:]]')
                        if [ "$$CURRENT" -lt "$$INGEST_PARTS" ]; then
                            DELTA=$$((INGEST_PARTS - CURRENT))
                            echo "Growing $$topic: $$CURRENT -> $$INGEST_PARTS partitions (+$$DELTA)"
                            rpk topic add-partitions "$$topic" \
                                --brokers kafka:9092 \
                                --num "$$DELTA" \
                                || echo "Failed to grow $$topic (need DELTA=$$DELTA), continuing"
                        else
                            echo "Topic $$topic already has $$CURRENT partitions (>= $$INGEST_PARTS), skipping"
                        fi
                    fi
                done

                # Belt-and-suspenders: also enforce retention at TOPIC level on
                # every existing topic. New topics still inherit cluster defaults.
                echo "Applying topic-level retention to all existing topics..."
                for topic in $$(rpk topic list --brokers kafka:9092 | tail -n +2 | awk '{print $$1}'); do
                    rpk topic alter-config "$$topic" \
                        --brokers kafka:9092 \
                        --set "retention.ms=$$KAFKA_LOG_RETENTION_MS" \
                        --set "segment.bytes=$$KAFKA_LOG_SEGMENT_SIZE" \
                        || echo "Failed to alter $$topic, continuing"
                done

                echo "Final topic list:"
                rpk topic list --brokers kafka:9092
                echo "Topics ready"
        depends_on:
            kafka:
                condition: service_healthy

    cymbal:
        <<: [*restart-prod, *mem-rust]
        image: posthog-cymbal
        build:
            context: ./rust
            args:
                BIN: cymbal
        logging: *default-logging
        volumes:
            - ./share:/share
        environment:
            <<: *pg-env
            KAFKA_HOSTS: 'kafka:9092'
            OBJECT_STORAGE_BUCKET: posthog
            # cymbal writes error-tracking blobs to SeaweedFS, not MinIO,
            # and SeaweedFS S3 implementation accepts any creds (`any`/`any`).
            OBJECT_STORAGE_ACCESS_KEY_ID: 'any'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENDPOINT: 'http://seaweedfs:8333'
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            BIND_HOST: '0.0.0.0'
            BIND_PORT: '3302'
            MAXMIND_DB_PATH: '/share/GeoLite2-City.mmdb'
            REDIS_URL: 'redis://redis7:6379/'
            ISSUE_BUCKETS_REDIS_URL: 'redis://redis7:6379/'
            RUST_LOG: 'info'
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            seaweedfs:
                condition: service_healthy
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy

volumes:
    zookeeper-data:
    zookeeper-datalog:
    zookeeper-logs:
    objectstorage:
    seaweedfs:
    postgres-data:
    clickhouse-data:
    caddy-data:
    caddy-config:
    redis7-data:
    kafka-data:
    redpanda-data:
